<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* the phone shows this page at 384x313: big text, big buttons */
  body{margin:0;height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#fff;
       background:linear-gradient(160deg,#6d5dfc,#c851c9 60%,#f08a6c)}
  .glass{padding:22px 30px;border-radius:28px;text-align:center;background:rgba(255,255,255,.16);
         border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(40,0,80,.25)}
  h1{margin:0;font-size:56px}
  p{margin:4px 0 14px;opacity:.85}
  button{font:600 18px system-ui;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:22px;
         padding:10px 22px;margin:0 4px;background:rgba(255,255,255,.18)}
</style>
</head>
<body>
<div class="glass">
  <h1 id="count">0</h1>
  <p>Hello from a mod!</p>
  <button onclick="send({a:'add'})">+1</button>
  <button onclick="send({a:'reset'})">Reset</button>
</div>
<script>
  // page -> mod: window.flippyos(text). It only exists inside FlippyOS.
  function send(msg) { if (window.flippyos) window.flippyos(JSON.stringify(msg)); }
  // mod -> page: FlippyOS calls window.update(json) with what your mod returned (or sent with FlippyOSLink.Send).
  window.update = function (state) { document.getElementById("count").textContent = state.count; };
  send({ a: "ready" });
</script>
</body>
</html>
