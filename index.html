<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlippyOS Developer Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0d0b1a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--text:#f4f2ff;--mute:#a9a3c7;--accent:#8b5cf6;--accent2:#facc15;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 15% -10%,#3b1d7a,transparent),radial-gradient(900px 500px at 100% 0,#5b2a86,transparent),var(--bg);min-height:100vh}
a{color:var(--accent2)}
header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);backdrop-filter:blur(10px);position:sticky;top:0;background:rgba(13,11,26,.7);z-index:5}
header .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ec4899);display:grid;place-items:center;font-weight:800}
header h1{font-size:17px;margin:0;flex:1}
header .me{color:var(--mute);font-size:13px}
main{max-width:1040px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px}
p,li{color:var(--mute);line-height:1.55;font-size:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
input,textarea,select{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:10px 12px}
textarea{min-height:110px;resize:vertical;font-family:Consolas,ui-monospace,monospace;font-size:13px}
input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
button{font:600 14px Inter,sans-serif;border:0;border-radius:11px;padding:10px 16px;cursor:pointer;background:var(--accent);color:#fff}
button.ghost{background:rgba(255,255,255,.1)}
button.ok{background:var(--ok);color:#06281c}
button.bad{background:var(--bad);color:#2a0606}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 320px;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.app{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer}
.app:hover{border-color:var(--accent)}
.ic{width:52px;height:52px;border-radius:13px;background:#3a3550 center/cover;flex:none;display:grid;place-items:center;font-weight:800;font-size:22px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.03em}
.chip.pending{background:rgba(251,191,36,.18);color:var(--warn)}
.chip.approved{background:rgba(52,211,153,.18);color:var(--ok)}
.chip.rejected{background:rgba(248,113,113,.18);color:var(--bad)}
.chip.none{background:rgba(255,255,255,.1);color:var(--mute)}
.err{color:var(--bad);font-size:13px;margin-top:8px;white-space:pre-wrap}
.okmsg{color:var(--ok);font-size:13px;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{background:rgba(255,255,255,.08)}
.tabs button.on{background:var(--accent)}
/* previews */
.phone{border-radius:22px;padding:18px;background:linear-gradient(160deg,#1e6fd9,#5b2a86 70%);display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;justify-items:center}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;width:64px}
.tile .i{width:56px;height:56px;border-radius:13px;background:#fff center/cover;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.tile .i.ghost{background:rgba(255,255,255,.25)}
.tile span{font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,40,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px}
.storerow{margin-top:12px;background:#fff;color:#000;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center}
.storerow .i{width:44px;height:44px;border-radius:11px;background:#e5e5ea center/cover;flex:none}
.storerow b{display:block;font-size:14px}
.storerow small{color:#8a8a8e;font-size:12px}
.storerow .get{margin-left:auto;background:#e9e9ee;color:#0a84ff;border-radius:14px;padding:5px 14px;font-weight:700;font-size:12px}
.md{background:#fff;color:#1c1c1e;border-radius:14px;padding:12px;font-size:13px;line-height:19px}
.md h4{margin:8px 0 4px}.md p{margin:0 0 6px;color:#1c1c1e}.md li{color:#1c1c1e}.md ol,.md ul{margin:0 0 6px 18px;padding:0}
.md code{background:#f2f2f7;padding:1px 4px;border-radius:4px;font-family:Consolas,monospace}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}
code.h{font-size:11px;color:var(--mute);word-break:break-all}
ol.steps li{margin-bottom:6px}
</style>
</head>
<body>
<header><div class="logo">F</div><h1>FlippyOS Developer Portal</h1><span class="me" id="me"></span><button class="ghost" id="out" hidden>Sign out</button></header>
<main id="main"></main>
<script>
"use strict";
const cfg = window.FLIPPYOS_STORE || {};
const $main = document.getElementById("main");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NL = String.fromCharCode(10);
let db, user, author, isAdmin = false;

const GUIDE_TEMPLATE = ["## What you need", "- FlippyOS 0.11 or newer", "", "## Install", "1. Press **GET**", "2. Restart Flipping is Hard (mods only)",
  "3. Open the app from your Home Screen", "", "## How to use it", "- Arrows move, Select clicks", "- Back leaves the app"].join(NL);

// the same safe Markdown subset the phone's store page shows (no HTML, no links, no images)
function md(text) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let out = "", list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of String(text || "").split(NL)) {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { close(); continue; }
    if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out += `<h4>${inline(m[1])}</h4>`; continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out += "<ol>"; list = "ol"; } out += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out += "<ul>"; list = "ul"; } out += `<li>${inline(m[1])}</li>`; continue; }
    close(); out += `<p>${inline(line)}</p>`;
  }
  close();
  return out || `<p style="color:#8a8a8e">Nothing yet.</p>`;
}

const iconUrl = p => p ? `${cfg.url}/storage/v1/object/public/icons/${p}` : "";
const say = (el, msg, ok) => { el.className = ok ? "okmsg" : "err"; el.textContent = msg || ""; };
const errText = e => (e && (e.message || e.error_description)) || String(e);

// ------------------------------------------------------------------ start

async function boot() {
  if (!cfg.url || !cfg.key || !window.supabase) {
    $main.innerHTML = `<div class="card"><h2>Not connected yet</h2><p>Put the App Store's Supabase address and public key in <code>config.js</code> next to this page.</p></div>`;
    return;
  }
  db = window.supabase.createClient(cfg.url, cfg.key);
  db.auth.onAuthStateChange((_e, s) => { const u = s?.user || null; if ((u && u.id) !== (user && user.id)) { user = u; route(); } });
  user = (await db.auth.getSession()).data.session?.user || null;
  document.getElementById("out").onclick = async () => { await db.auth.signOut(); user = null; route(); };
  route();
}

async function route() {
  document.getElementById("out").hidden = !user;
  document.getElementById("me").textContent = user ? user.email : "";
  if (!user) return signIn();
  author = (await db.from("authors").select("*").eq("id", user.id).maybeSingle()).data;
  if (!author) return chooseName();
  isAdmin = !!(await db.from("admins").select("id").eq("id", user.id).maybeSingle()).data;
  document.getElementById("me").textContent = author.name + (isAdmin ? " · admin" : "");
  home();
}

function signIn() {
  $main.innerHTML = `<div class="grid"><div class="card"><h2>Publish apps for FlippyOS</h2>
    <p>Make an app for Flippy's phone and put it in the App Store for everyone who plays with FlippyOS.</p>
    <label>Email</label><input id="em" type="email" autocomplete="email">
    <label>Password</label><input id="pw" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:14px"><button id="in">Sign in</button><button class="ghost" id="up">Create an account</button></div>
    <div id="msg"></div></div>${helpCard()}</div>`;
  const msg = document.getElementById("msg");
  const creds = () => ({ email: document.getElementById("em").value.trim(), password: document.getElementById("pw").value });
  document.getElementById("in").onclick = async () => {
    const { error } = await db.auth.signInWithPassword(creds());
    if (error) say(msg, errText(error));
  };
  document.getElementById("up").onclick = async () => {
    const c = creds();
    if (c.password.length < 8) return say(msg, "Use a password of at least 8 characters.");
    const { data, error } = await db.auth.signUp({ ...c, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) return say(msg, errText(error));
    if (!data.session) say(msg, "Check your email and click the link to finish signing up, then sign in here.", true);
  };
}

function chooseName() {
  $main.innerHTML = `<div class="card" style="max-width:520px"><h2>Your author name</h2><p>Players see it under your apps in the App Store.</p>
    <label>Name</label><input id="nm" maxlength="32" placeholder="e.g. Fabuleo"><div class="row" style="margin-top:14px"><button id="go">Continue</button></div><div id="msg"></div></div>`;
  document.getElementById("go").onclick = async () => {
    const name = document.getElementById("nm").value.trim();
    const { error } = await db.from("authors").insert({ id: user.id, name });
    if (error) return say(document.getElementById("msg"), errText(error));
    route();
  };
}

// ------------------------------------------------------------------ my apps

async function home() {
  const { data: apps, error } = await db.from("apps").select("*, versions(version,status,created_at)").eq("owner", user.id).order("created_at");
  let h = `<div class="card"><div class="row"><h2 style="flex:1;margin:0">Your apps</h2><button id="new">New app</button></div>`;
  if (error) h += `<div class="err">${esc(errText(error))}</div>`;
  else if (!apps.length) h += `<p>No apps yet. Press <b>New app</b> to make your first one.</p>`;
  else h += `<div class="apps" style="margin-top:14px">` + apps.map(a => {
    const v = (a.versions || []).sort((x, y) => y.created_at.localeCompare(x.created_at))[0];
    const st = v ? v.status : "none";
    return `<div class="app" data-id="${esc(a.id)}"><div class="ic" style="${a.icon_path ? `background-image:url('${esc(iconUrl(a.icon_path))}')` : ""}">${a.icon_path ? "" : esc(a.name.charAt(0))}</div>
      <div style="min-width:0"><b>${esc(a.name)}</b><div class="hint">${a.kind === "web" ? "Web app" : "Mod"} · ${v ? "v" + esc(v.version) : "no version yet"}</div>
      <span class="chip ${st}">${st === "none" ? "DRAFT" : st.toUpperCase()}</span></div></div>`;
  }).join("") + `</div>`;
  h += `</div>`;
  if (isAdmin) h += `<div class="card" id="queue"><h2>Review queue</h2><p>Loading…</p></div>`;
  h += helpCard();
  $main.innerHTML = h;
  document.getElementById("new").onclick = () => editor(null);
  document.querySelectorAll(".app").forEach(el => el.onclick = () => editor(apps.find(a => a.id === el.dataset.id)));
  if (isAdmin) queue();
}

function helpCard() {
  return `<div class="card"><h2>How publishing works</h2><ol class="steps">
    <li><b>Make your app.</b> Two kinds: a <b>web app</b> (any https page; it opens full-screen on Flippy's phone with the pointer and keyboard) or a <b>mod</b> (a BepInEx 6 IL2CPP plugin .dll that FlippyOS installs into <code>BepInEx\\plugins\\&lt;folder&gt;</code>).</li>
    <li><b>Create it here.</b> Pick a short id (like <code>flip-notes</code>, it never changes), a name of up to 24 letters, a one-line tagline and a square icon (PNG or JPG; it's cropped and rounded for you, see the preview).</li>
    <li><b>Write the install guide.</b> Players read it on your app's page in the phone's App Store: what they need, how to install, how to use it. Start from the template.</li>
    <li><b>Publish a version.</b> Web app: its https address. Mod: upload the .dll (its SHA-256 fingerprint is computed in your browser; the phone refuses any download that doesn't match).</li>
    <li><b>Wait for review.</b> Every version is checked before players see it. Once approved it's in the App Store's <b>Apps</b> tab. Updates are new versions, reviewed the same way; players' phones pick them up.</li>
  </ol><p>Rules: no malware, no stealing accounts or data, nothing that breaks other mods or the game's online play. Apps that do get removed.</p></div>`;
}

// ------------------------------------------------------------------ one app

async function editor(app) {
  const isNew = !app;
  app = app || { id: "", name: "", tagline: "", description: "", guide: GUIDE_TEMPLATE, kind: "web", icon_path: null };
  let iconBlob = null, iconPreview = app.icon_path ? iconUrl(app.icon_path) : "";
  $main.innerHTML = `<div class="row" style="margin-bottom:12px"><button class="ghost" id="back">‹ Your apps</button></div>
  <div class="grid"><div>
    <div class="card"><h2>${isNew ? "New app" : esc(app.name)}</h2>
      <label>App id</label><input id="f-id" value="${esc(app.id)}" ${isNew ? "" : "disabled"} placeholder="flip-notes" maxlength="40">
      <div class="hint">Lowercase letters, numbers and dashes. It can't change later.</div>
      <label>Kind</label><select id="f-kind" ${isNew ? "" : "disabled"}><option value="web">Web app (an https page)</option><option value="mod">Mod (a BepInEx .dll)</option></select>
      <label>Name</label><input id="f-name" value="${esc(app.name)}" maxlength="24">
      <label>Tagline</label><input id="f-tag" value="${esc(app.tagline)}" maxlength="80" placeholder="What it does, in one line">
      <label>Icon</label><input id="f-icon" type="file" accept="image/png,image/jpeg"><div class="hint">Square works best. Cropped to the middle and saved as 256×256.</div>
      <label>Description</label><textarea id="f-desc" maxlength="4000">${esc(app.description)}</textarea>
      <label>Install and use guide</label><textarea id="f-guide" maxlength="8000" style="min-height:180px">${esc(app.guide)}</textarea>
      <div class="hint"><code>## heading</code>, <code>1. step</code>, <code>- point</code>, <code>**bold**</code>, <code>\`key\`</code>. No links or HTML.</div>
      <div class="row" style="margin-top:14px"><button id="save">${isNew ? "Create app" : "Save"}</button>${isNew ? "" : `<button class="bad" id="del">Delete app</button>`}</div>
      <div id="msg"></div>
    </div>
    ${isNew ? "" : `<div class="card" id="versions"><h2>Versions</h2><p>Loading…</p></div>`}
  </div><div>
    <div class="card"><h3 style="margin-top:0">On the Home Screen</h3><div class="phone" id="pv-home"></div>
      <h3>In the App Store</h3><div class="storerow" id="pv-row"></div>
      <h3>Your guide on the phone</h3><div class="md" id="pv-guide"></div></div>
  </div></div>`;
  const $ = id => document.getElementById(id);
  $("f-kind").value = app.kind;
  $("back").onclick = home;
  const preview = () => {
    const name = $("f-name").value || "App name", ic = iconPreview ? `background-image:url('${iconPreview}')` : "";
    const tiles = ["#10a37f", "#ff9500", "#5856d6"].map(c => `<div class="tile"><div class="i" style="background:${c}"></div><span>&nbsp;</span></div>`).join("");
    $("pv-home").innerHTML = tiles + `<div class="tile"><div class="i${ic ? "" : " ghost"}" style="${ic}"></div><span>${esc(name)}</span></div>`;
    $("pv-row").innerHTML = `<div class="i" style="${ic}"></div><div style="min-width:0"><b>${esc(name)}</b><small>${esc($("f-tag").value || author.name)}</small></div><span class="get">GET</span>`;
    $("pv-guide").innerHTML = md($("f-guide").value);
  };
  ["f-name", "f-tag", "f-guide"].forEach(id => $(id).addEventListener("input", preview));
  $("f-icon").onchange = async () => {
    const file = $("f-icon").files[0];
    if (!file) return;
    iconBlob = await squareIcon(file);
    iconPreview = URL.createObjectURL(iconBlob);
    preview();
  };
  preview();

  $("save").onclick = async () => {
    const msg = $("msg"); say(msg, "Saving…", true);
    try {
      const id = isNew ? $("f-id").value.trim() : app.id;
      if (!/^[a-z0-9][a-z0-9-]{1,39}$/.test(id)) throw new Error("The app id must be 2-40 lowercase letters, numbers or dashes.");
      const row = { name: $("f-name").value.trim(), tagline: $("f-tag").value.trim(), description: $("f-desc").value, guide: $("f-guide").value };
      if (!row.name) throw new Error("Give your app a name.");
      if (isNew) {
        const { error } = await db.from("apps").insert({ id, kind: $("f-kind").value, ...row });
        if (error) throw error;
      }
      if (iconBlob) {
        const path = `${user.id}/${id}/icon-${Date.now()}.png`;
        const up = await db.storage.from("icons").upload(path, iconBlob, { contentType: "image/png", upsert: false });
        if (up.error) throw up.error;
        row.icon_path = path;
      }
      const { data, error } = await db.from("apps").update(row).eq("id", id).select().single();
      if (error) throw error;
      say(msg, "Saved.", true);
      if (isNew) editor(data);
      else app = data;
    } catch (e) { say(msg, errText(e)); }
  };
  if (!isNew) {
    $("del").onclick = async () => {
      if (!confirm(`Delete ${app.name} and all its versions? Players who already have it keep it.`)) return;
      const { error } = await db.from("apps").delete().eq("id", app.id);
      if (error) return say($("msg"), errText(error));
      home();
    };
    versions(app);
  }
}

/// any picture -> a 256x256 PNG, cropped to the middle
function squareIcon(file) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = 256;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 256, 256);
      c.toBlob(b => b ? ok(b) : fail(new Error("Couldn't read that picture")), "image/png");
    };
    img.onerror = () => fail(new Error("Couldn't read that picture"));
    img.src = URL.createObjectURL(file);
  });
}

async function sha256(buf) {
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", buf));
  return [...h].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function versions(app) {
  const box = document.getElementById("versions");
  const { data: vs, error } = await db.from("versions").select("*").eq("app_id", app.id).order("created_at", { ascending: false });
  if (error) { box.innerHTML = `<h2>Versions</h2><div class="err">${esc(errText(error))}</div>`; return; }
  const last = vs.find(v => v.folder);
  let h = `<h2>Versions</h2>`;
  h += vs.length ? `<table><tr><th>Version</th><th>Status</th><th>${app.kind === "web" ? "Address" : "File"}</th><th>Notes</th></tr>` + vs.map(v =>
    `<tr><td>${esc(v.version)}</td><td><span class="chip ${v.status}">${v.status.toUpperCase()}</span>${v.review_note ? `<div class="hint">${esc(v.review_note)}</div>` : ""}</td>
     <td>${app.kind === "web" ? esc(v.web_url) : `${esc(v.folder)}\\${esc(v.file_name)}<br><code class="h">${esc(v.sha256)}</code>`}</td><td>${esc(v.notes)}</td></tr>`).join("") + `</table>`
    : `<p>No versions yet. Publish one to send your app for review.</p>`;
  h += `<h3>Publish a new version</h3><div class="row"><div style="flex:1;min-width:140px"><label>Version</label><input id="v-ver" placeholder="1.0.0"></div>`;
  h += app.kind === "web"
    ? `<div style="flex:3;min-width:220px"><label>Address (https)</label><input id="v-url" placeholder="https://you.github.io/my-app/" value="${esc(vs[0]?.web_url || "")}"></div></div>`
    : `<div style="flex:3;min-width:220px"><label>Plugin .dll</label><input id="v-file" type="file" accept=".dll"></div></div>
       <label>Plugin folder</label><input id="v-folder" value="${esc(last?.folder || app.name.replace(/[^A-Za-z0-9._ -]/g, ""))}" ${last ? "disabled" : ""}>
       <div class="hint">It goes to <code>BepInEx\\plugins\\&lt;folder&gt;</code>. One folder per app, forever.</div><div class="hint" id="v-hash"></div>`;
  h += `<label>What's new</label><textarea id="v-notes" style="min-height:70px" maxlength="2000"></textarea>
    <div class="row" style="margin-top:12px"><button id="v-go">Send for review</button></div><div id="v-msg"></div>`;
  box.innerHTML = h;
  const $ = id => document.getElementById(id);
  let fileBuf = null, fileName = null, hash = null;
  if (app.kind === "mod") $("v-file").onchange = async () => {
    const f = $("v-file").files[0];
    if (!f) return;
    if (!/\.dll$/i.test(f.name)) return say($("v-msg"), "Pick the plugin's .dll file.");
    if (f.size > 50 * 1048576) return say($("v-msg"), "The file is bigger than 50 MB.");
    fileBuf = await f.arrayBuffer(); fileName = f.name; hash = await sha256(fileBuf);
    $("v-hash").textContent = `SHA-256 ${hash} · ${(f.size / 1024).toFixed(0)} KB`;
  };
  $("v-go").onclick = async () => {
    const msg = $("v-msg"); say(msg, "Sending…", true);
    try {
      const version = $("v-ver").value.trim();
      if (!/^[0-9]+(\.[0-9]+){0,3}$/.test(version)) throw new Error("Use a version like 1.0.0");
      const row = { app_id: app.id, version, notes: $("v-notes").value };
      if (app.kind === "web") {
        row.web_url = $("v-url").value.trim();
        if (!/^https:\/\/[^\s]+$/.test(row.web_url)) throw new Error("The address must start with https://");
      } else {
        if (!fileBuf) throw new Error("Pick the plugin's .dll file.");
        row.folder = $("v-folder").value.trim();
        row.file_name = fileName;
        row.storage_path = `${user.id}/${app.id}/${version}/${fileName}`;
        row.sha256 = hash;
        row.size_bytes = fileBuf.byteLength;
        const up = await db.storage.from("apps").upload(row.storage_path, new Blob([fileBuf]), { contentType: "application/octet-stream", upsert: false });
        if (up.error) throw up.error;
      }
      const { error } = await db.from("versions").insert(row);
      if (error) throw error;
      versions(app);
    } catch (e) { say(msg, errText(e)); }
  };
}

// ------------------------------------------------------------------ admin: review

async function queue() {
  const box = document.getElementById("queue");
  const { data: vs, error } = await db.from("versions").select("*, apps(name,kind,tagline,featured,owner,authors(name))").eq("status", "pending").order("created_at");
  if (error) { box.innerHTML = `<h2>Review queue</h2><div class="err">${esc(errText(error))}</div>`; return; }
  let h = `<h2>Review queue</h2>`;
  if (!vs.length) h += `<p>Nothing to review.</p>`;
  else h += `<table><tr><th>App</th><th>Version</th><th>What to check</th><th></th></tr>` + vs.map(v => {
    const a = v.apps || {};
    const what = a.kind === "web"
      ? `Open it and check it: <a href="${esc(v.web_url)}" target="_blank" rel="noopener noreferrer">${esc(v.web_url)}</a>`
      : `<a href="${esc(cfg.url)}/storage/v1/object/public/apps/${esc(v.storage_path)}" rel="noopener">Download ${esc(v.file_name)}</a> → plugins\\${esc(v.folder)}<br><code class="h">${esc(v.sha256)}</code>`;
    return `<tr><td><b>${esc(a.name)}</b><div class="hint">${esc(v.app_id)} · by ${esc(a.authors?.name)}</div></td><td>${esc(v.version)}<div class="hint">${esc(v.notes)}</div></td><td>${what}</td>
      <td><div class="row"><button class="ok" data-ok="${v.id}">Approve</button><button class="bad" data-no="${v.id}">Reject</button></div>
      <label style="margin-top:6px"><input type="checkbox" data-feat="${esc(v.app_id)}" ${a.featured ? "checked" : ""} style="width:auto"> Featured</label></td></tr>`;
  }).join("") + `</table>`;
  h += `<div id="q-msg"></div>`;
  box.innerHTML = h;
  const msg = document.getElementById("q-msg");
  box.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
    const { error } = await db.from("versions").update({ status: "approved", review_note: "" }).eq("id", b.dataset.ok);
    if (error) return say(msg, errText(error));
    queue();
  });
  box.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => {
    const note = prompt("Why is it rejected? The author sees this.") || "";
    const { error } = await db.from("versions").update({ status: "rejected", review_note: note }).eq("id", b.dataset.no);
    if (error) return say(msg, errText(error));
    queue();
  });
  box.querySelectorAll("[data-feat]").forEach(c => c.onchange = async () => {
    const { error } = await db.from("apps").update({ featured: c.checked }).eq("id", c.dataset.feat);
    if (error) say(msg, errText(error));
  });
}

boot();
</script>
